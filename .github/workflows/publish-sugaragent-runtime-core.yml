name: Publish SugarAgent Runtime Core

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@sugarengine'

      - name: Install workspace dependencies
        run: npm install

      - name: Build runtime core package
        run: npm run build --workspace @sugarengine/sugaragent-runtime-core

      - name: Publish runtime core package
        run: npm publish --workspace @sugarengine/sugaragent-runtime-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
